<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Player Registry</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f6fb;
        }

        .hero {

            height: 100vh;

            background:
            linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
            url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;

        }

        .container {

            text-align: center;
            color: white;

        }

        h1 {

            font-size: 60px;
            margin-bottom: 10px;

        }

        p {

            font-size: 22px;
            margin-bottom: 30px;

        }

        .search-box {

            display: flex;
            justify-content: center;
            gap: 10px;

        }

        input {

            width: 420px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;

        }

        button {

            padding: 16px 30px;
            border: none;
            border-radius: 10px;
            background: #0056d6;
            color: white;
            font-size: 16px;
            cursor: pointer;

        }

        .profile {

            display: none;

            width: 900px;

            margin: 50px auto;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

        }

        .header {

            background: linear-gradient(90deg, #002b5e, #0056d6);

            color: white;

            padding: 30px;

            font-size: 30px;
            font-weight: bold;

        }

        .profile-content {

            padding: 30px;

        }

        .top {

            display: flex;
            gap: 30px;
            align-items: center;

        }

        .photo {

            width: 180px;
            height: 180px;

            object-fit: contain;

            transform: rotate(-90deg);

            border-radius: 15px;

            border: 4px solid #ddd;

            background: white;

        }

        .name {

            font-size: 40px;
            font-weight: bold;

        }

        .club {

            color: #666;
            font-size: 22px;
            margin-top: 5px;

        }

        .active {

            display: inline-block;

            margin-top: 15px;

            padding: 10px 20px;

            border-radius: 20px;

            background: green;

            color: white;

            font-weight: bold;

        }

        .grid {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 20px;

            margin-top: 40px;

        }

        .card {

            background: #f7f9fc;

            padding: 20px;

            border-radius: 15px;

        }

        .label {

            color: gray;
            font-size: 14px;

        }

        .value {

            margin-top: 8px;

            font-size: 24px;

            font-weight: bold;

        }

        @media (max-width: 900px) {

            h1 {
                font-size: 38px;
            }

            .search-box {
                flex-direction: column;
                align-items: center;
            }

            input {
                width: 90%;
            }

            .profile {
                width: 95%;
            }

            .top {
                flex-direction: column;
                text-align: center;
            }

            .grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="hero">

        <div class="container">

            <h1>⚽ Football Player Registry</h1>

            <p>Search player registration details using Player ID</p>

            <div class="search-box">

                <input
                    type="text"
                    id="playerId"
                    placeholder="Enter Player ID">

                <button onclick="searchPlayer()">
                    Search
                </button>

            </div>

        </div>

    </div>

    <div class="profile" id="profile">

        <div class="header">

            Player Profile

        </div>

        <div class="profile-content">

            <div class="top">

                <img src="profile.jpg" class="photo">

                <div>

                    <div class="name">
                        Shaurya Vikas Katial
                    </div>

                    <div class="club">
                        Hungry Harts Soccer School
                    </div>

                    <div class="active">
                        ACTIVE
                    </div>

                </div>

            </div>

            <div class="grid">

                <div class="card">
                    <div class="label">Player ID</div>
                    <div class="value">7400464980186</div>
                </div>

                <div class="card">
                    <div class="label">Jersey Number</div>
                    <div class="value">12</div>
                </div>

                <div class="card">
                    <div class="label">Height</div>
                    <div class="value">171 cm</div>
                </div>

                <div class="card">
                    <div class="label">Weight</div>
                    <div class="value">52 kg</div>
                </div>

                <div class="card">
                    <div class="label">Registered On</div>
                    <div class="value">20 October 2025</div>
                </div>

                <div class="card">
                    <div class="label">Valid Till</div>
                    <div class="value">31 December 2027</div>
                </div>

            </div>

        </div>

    </div>

    <script>

        function searchPlayer() {

            let id = document.getElementById("playerId").value;

            if (id === "7400464980186") {

                document.getElementById("profile").style.display = "block";

                document.getElementById("profile").scrollIntoView({

                    behavior: "smooth"

                });

            }

            else {

                alert("Player not found");

            }

        }

    </script>

</body>
</html>
