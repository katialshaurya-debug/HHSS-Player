<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Player Registry</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f5fa;
        }

        .hero {

            height: 100vh;

            background-image:
                linear-gradient(rgba(0, 0, 0, 0.55),
                rgba(0, 0, 0, 0.55)),
                url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");

            background-size: cover;
            background-position: center;

        }

        .overlay {

            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: white;
            text-align: center;

        }

        .overlay h1 {

            font-size: 55px;
            margin-bottom: 10px;

        }

        .overlay p {

            font-size: 20px;
            margin-bottom: 30px;

        }

        .search-box {

            display: flex;
            gap: 10px;

        }

        .search-box input {

            width: 400px;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 16px;

        }

        .search-box button {

            padding: 16px 30px;
            border: none;
            border-radius: 10px;
            background: #0055cc;
            color: white;
            cursor: pointer;
            font-size: 16px;

        }

        .profile {

            display: none;

            width: 850px;

            margin: 40px auto;

            background: white;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

            overflow: hidden;

        }

        .banner {

            height: 120px;

            background: linear-gradient(90deg, #003366, #0055cc);

        }

        .profile-content {

            padding: 30px;

        }

        .top {

            display: flex;
            gap: 25px;
            align-items: center;

            margin-top: -70px;

        }

        .photo {

            width: 150px;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            border: 5px solid white;

        }

        .active {

            background: green;
            color: white;

            padding: 8px 15px;

            border-radius: 20px;

        }

        .grid {

            margin-top: 30px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 15px;

        }

        .box {

            background: #f5f7fb;

            padding: 15px;

            border-radius: 10px;

        }

        .label {

            color: gray;
            font-size: 14px;

        }

        .value {

            font-size: 18px;
            font-weight: bold;
            margin-top: 5px;

        }

        @media(max-width:900px) {

            .overlay h1 {

                font-size: 35px;

            }

            .search-box {

                flex-direction: column;

            }

            .search-box input {

                width: 90%;

            }

            .profile {

                width: 95%;

            }

            .top {

                flex-direction: column;

                text-align: center;

            }

            .grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>

<body>

    <div class="hero">

        <div class="overlay">

            <h1>⚽ Football Player Registry</h1>

            <p>Search player registration details using the player ID</p>

            <div class="search-box">

                <input
                    type="text"
                    id="playerId"
                    placeholder="Enter Player ID">

                <button onclick="searchPlayer()">

                    Search

                </button>

            </div>

        </div>

    </div>

    <div class="profile" id="profile">

        <div class="banner"></div>

        <div class="profile-content">

            <div class="top">

                <img src="profile.jpg" class="photo">

                <div>

                    <h2>Shaurya Vikas Katial</h2>

                    <p>Hungry Harts Soccer School</p>

                    <span class="active">ACTIVE</span>

                </div>

            </div>

            <div class="grid">

                <div class="box">
                    <div class="label">Player ID</div>
                    <div class="value">7400464980186</div>
                </div>

                <div class="box">
                    <div class="label">Jersey Number</div>
                    <div class="value">12</div>
                </div>

                <div class="box">
                    <div class="label">Height</div>
                    <div class="value">171 cm</div>
                </div>

                <div class="box">
                    <div class="label">Weight</div>
                    <div class="value">52 kg</div>
                </div>

                <div class="box">
                    <div class="label">Registered On</div>
                    <div class="value">26 April 2026</div>
                </div>

                <div class="box">
                    <div class="label">Valid Till</div>
                    <div class="value">31 December 2027</div>
                </div>

            </div>

        </div>

    </div>

    <script>

        function searchPlayer() {

            let id = document.getElementById("playerId").value;

            if (id === "7400464980186") {

                document.getElementById("profile").style.display = "block";

                window.scrollTo({

                    top: document.getElementById("profile").offsetTop,

                    behavior: "smooth"

                });

            }

            else {

                alert("Player not found");

            }

        }

    </script>

</body>

</html>
