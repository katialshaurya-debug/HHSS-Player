<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Player Registry</title>

    <style>

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

            font-family: Arial, sans-serif;

        }

        body {

            background: #eef3fa;

        }

        .hero {

            height: 100vh;

            background:
            linear-gradient(rgba(0, 43, 91, 0.7), rgba(0, 43, 91, 0.7)),
            url("https://images.unsplash.com/photo-1574629810360-7efbbe195018");

            background-size: cover;

            background-position: center;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .search-card {

            width: 700px;

            background: rgba(255,255,255,0.95);

            border-radius: 25px;

            padding: 50px;

            text-align: center;

            box-shadow: 0 15px 40px rgba(0,0,0,0.25);

        }

        .logo {

            font-size: 50px;

            margin-bottom: 20px;

        }

        h1 {

            color: #003b8e;

            margin-bottom: 15px;

        }

        p {

            color: gray;

            margin-bottom: 30px;

        }

        input {

            width: 100%;

            padding: 18px;

            border-radius: 12px;

            border: 1px solid #ccc;

            font-size: 18px;

        }

        button {

            width: 100%;

            margin-top: 20px;

            padding: 18px;

            border: none;

            border-radius: 12px;

            background: #0056d6;

            color: white;

            font-size: 18px;

            cursor: pointer;

        }

        button:hover {

            background: #003b8e;

        }

        .profile {

            display: none;

            width: 1200px;

            margin: 40px auto;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 15px 40px rgba(0,0,0,0.15);

        }

        .header {

            height: 220px;

            background: linear-gradient(135deg, #003b8e, #0056d6);

        }

        .profile-content {

            padding: 40px;

            margin-top: -120px;

        }

        .top {

            display: flex;

            gap: 40px;

            align-items: center;

        }

        .photo {

            width: 230px;

            height: 230px;

            object-fit: cover;

            transform: rotate(90deg);

            border-radius: 20px;

            border: 8px solid white;

            background: white;

            box-shadow: 0 10px 25px rgba(0,0,0,0.25);

        }

        .name {

            font-size: 45px;

            font-weight: bold;

        }

        .club {

            font-size: 28px;

            margin-top: 10px;

            color: #555;

        }

        .active {

            display: inline-block;

            margin-top: 15px;

            padding: 12px 25px;

            background: green;

            color: white;

            border-radius: 50px;

            font-weight: bold;

        }

        .grid {

            margin-top: 40px;

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 25px;

        }

        .card {

            background: #f5f8fd;

            padding: 25px;

            border-radius: 18px;

        }

        .label {

            color: gray;

            font-size: 17px;

        }

        .value {

            margin-top: 10px;

            font-size: 30px;

            font-weight: bold;

        }

    </style>

</head>

<body>

<div class="hero">

    <div class="search-card">

        <div class="logo">⚽</div>

        <h1>Football Player Registry</h1>

        <p>Enter your Player ID</p>

        <input id="playerId" placeholder="Enter Player ID">

        <button onclick="searchPlayer()">Search</button>

    </div>

</div>
